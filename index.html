<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Space Mono', 'Courier New', monospace;
      padding: 40px 20px;
      background: #0b0d17;
      background-image: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=1920&q=80');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(11, 13, 23, 0.5) 0%,
        rgba(11, 13, 23, 0.3) 40%,
        rgba(11, 13, 23, 0.6) 100%
      );
      z-index: 0;
    }

    .notepad {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 540px;
      background: rgba(15, 18, 35, 0.85);
      border-radius: 12px;
      border: 1px solid rgba(99, 132, 255, 0.2);
      box-shadow:
        0 0 40px rgba(99, 132, 255, 0.08),
        0 8px 32px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
    }

    .notepad-header {
      background: linear-gradient(135deg, rgba(56, 97, 251, 0.9), rgba(138, 43, 226, 0.9));
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(99, 132, 255, 0.3);
    }

    .notepad-header .ring {
      width: 12px;
      height: 12px;
      border: 2px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
    }

    .notepad-header h1 {
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      margin-left: 10px;
      letter-spacing: 3px;
      text-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
    }

    .notepad-body {
      padding: 6px 0 0 0;
      min-height: 300px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .notepad-body::-webkit-scrollbar {
      width: 6px;
    }

    .notepad-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .notepad-body::-webkit-scrollbar-thumb {
      background: rgba(99, 132, 255, 0.3);
      border-radius: 3px;
    }

    .task-list {
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: flex-start;
      padding: 12px 24px;
      border-bottom: 1px solid rgba(99, 132, 255, 0.08);
      transition: background 0.2s;
    }

    .task-item:hover {
      background: rgba(99, 132, 255, 0.05);
    }

    .task-item[draggable='true'] {
      cursor: grab;
    }

    .task-item.dragging {
      opacity: 0.35;
      background: rgba(99, 132, 255, 0.08);
      box-shadow: inset 2px 0 0 #6384ff;
    }

    .task-bullet {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(99, 132, 255, 0.5);
      border-radius: 50%;
      margin-right: 14px;
      margin-top: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .task-bullet:hover {
      border-color: #6384ff;
      box-shadow: 0 0 10px rgba(99, 132, 255, 0.4);
    }

    .task-item.completed .task-bullet {
      background: linear-gradient(135deg, #6384ff, #8a2be2);
      border-color: transparent;
      box-shadow: 0 0 12px rgba(99, 132, 255, 0.5);
    }

    .task-item.completed .task-bullet::after {
      content: '\2713';
      color: #fff;
      font-size: 12px;
      font-weight: bold;
    }

    .task-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.9);
      word-break: break-word;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: rgba(255, 255, 255, 0.3);
    }

    .task-text-input {
      flex: 1;
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 14px;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.9);
      border: none;
      border-bottom: 1px solid rgba(99, 132, 255, 0.4);
      background: rgba(99, 132, 255, 0.05);
      outline: none;
      padding: 2px 4px;
    }

    .task-actions {
      display: flex;
      gap: 6px;
      margin-left: 12px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .task-item:hover .task-actions {
      opacity: 1;
    }

    .task-actions button {
      background: none;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.35);
      padding: 3px 6px;
      border-radius: 4px;
      transition: all 0.2s;
    }

    .task-actions button:hover {
      color: #fff;
      background: rgba(99, 132, 255, 0.15);
      border-color: rgba(99, 132, 255, 0.3);
    }

    .task-actions button.delete-btn:hover {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.1);
      border-color: rgba(255, 107, 107, 0.3);
    }

    .add-task-area {
      display: flex;
      padding: 14px 24px 18px 24px;
      gap: 10px;
      align-items: center;
      border-top: 1px solid rgba(99, 132, 255, 0.1);
    }

    .add-task-area input {
      flex: 1;
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 14px;
      padding: 10px 14px;
      border: 1px solid rgba(99, 132, 255, 0.25);
      border-radius: 8px;
      background: rgba(99, 132, 255, 0.06);
      outline: none;
      color: rgba(255, 255, 255, 0.9);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .add-task-area input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .add-task-area input:focus {
      border-color: rgba(99, 132, 255, 0.6);
      box-shadow: 0 0 16px rgba(99, 132, 255, 0.15);
    }

    .add-task-area button {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 13px;
      padding: 10px 20px;
      background: linear-gradient(135deg, #6384ff, #8a2be2);
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 1px;
      transition: all 0.25s;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    }

    .add-task-area button:hover {
      box-shadow: 0 0 24px rgba(99, 132, 255, 0.4);
      transform: translateY(-1px);
    }

    .add-task-area button:active {
      transform: translateY(0);
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-bottom: 1px solid rgba(99, 132, 255, 0.1);
    }

    .toolbar .spacer {
      flex: 1;
    }

    .toolbar button {
      font-family: 'Space Mono', 'Courier New', monospace;
      font-size: 11px;
      padding: 4px 10px;
      background: rgba(99, 132, 255, 0.06);
      color: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(99, 132, 255, 0.25);
      border-radius: 5px;
      cursor: pointer;
      letter-spacing: 1px;
      transition: all 0.2s;
    }

    .toolbar button:hover {
      color: #fff;
      border-color: rgba(99, 132, 255, 0.6);
      background: rgba(99, 132, 255, 0.15);
      box-shadow: 0 0 12px rgba(99, 132, 255, 0.2);
    }

    .toolbar button.danger:hover {
      color: #ff6b6b;
      border-color: rgba(255, 107, 107, 0.5);
      background: rgba(255, 107, 107, 0.08);
      box-shadow: 0 0 12px rgba(255, 107, 107, 0.15);
    }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: rgba(255, 255, 255, 0.25);
      font-size: 13px;
      font-style: italic;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="notepad">
    <div class="notepad-header">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <h1>TO DO LIST</h1>
    </div>
    <div class="toolbar">
      <button id="exportBtn" title="Export tasks to a JSON file">Export</button>
      <button id="importBtn" title="Import tasks from a JSON file">Import</button>
      <div class="spacer"></div>
      <button id="clearBtn" class="danger" title="Delete all tasks">Clear all</button>
      <input type="file" id="importFileInput" accept=".json,application/json" hidden />
    </div>
    <div class="notepad-body">
      <ul class="task-list" id="taskList"></ul>
    </div>
    <div class="add-task-area">
      <input type="text" id="newTaskInput" placeholder="Add a new task..." />
      <button id="addTaskBtn">Add</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'todo-tasks';

    function getTasks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTasks(tasks) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function renderTasks() {
      const tasks = getTasks();
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      if (tasks.length === 0) {
        list.innerHTML = '<li class="empty-state">No tasks yet. Add one above!</li>';
        return;
      }

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.completed ? ' completed' : '');
        li.draggable = true;
        li.dataset.index = index;
        li.addEventListener('dragstart', handleDragStart);
        li.addEventListener('dragend', handleDragEnd);

        const bullet = document.createElement('div');
        bullet.className = 'task-bullet';
        bullet.title = 'Toggle completed';
        bullet.addEventListener('click', () => toggleTask(index));

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;
        text.addEventListener('dblclick', () => startEditing(index, li, task));

        const actions = document.createElement('div');
        actions.className = 'task-actions';

        const editBtn = document.createElement('button');
        editBtn.textContent = '\u270E';
        editBtn.title = 'Edit task';
        editBtn.addEventListener('click', () => startEditing(index, li, task));

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '\u2715';
        deleteBtn.title = 'Delete task';
        deleteBtn.addEventListener('click', () => deleteTask(index));

        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);

        li.appendChild(bullet);
        li.appendChild(text);
        li.appendChild(actions);
        list.appendChild(li);
      });
    }

    function startEditing(index, li, task) {
      const tasks = getTasks();
      const textSpan = li.querySelector('.task-text');
      if (!textSpan) return;

      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'task-text-input';
      input.value = task.text;

      function finishEdit() {
        const newText = input.value.trim();
        if (newText) {
          tasks[index].text = newText;
          saveTasks(tasks);
        }
        renderTasks();
      }

      input.addEventListener('blur', finishEdit);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') input.blur();
        if (e.key === 'Escape') {
          input.value = task.text;
          input.blur();
        }
      });

      textSpan.replaceWith(input);
      input.focus();
      input.select();
    }

    function addTask() {
      const input = document.getElementById('newTaskInput');
      const text = input.value.trim();
      if (!text) return;

      const tasks = getTasks();
      tasks.push({ text, completed: false });
      saveTasks(tasks);
      input.value = '';
      renderTasks();
    }

    function toggleTask(index) {
      const tasks = getTasks();
      tasks[index].completed = !tasks[index].completed;
      saveTasks(tasks);
      renderTasks();
    }

    function deleteTask(index) {
      const tasks = getTasks();
      tasks.splice(index, 1);
      saveTasks(tasks);
      renderTasks();
    }

    function handleDragStart(e) {
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', '');
      requestAnimationFrame(() => this.classList.add('dragging'));
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const list = document.getElementById('taskList');
      const dragging = list.querySelector('.task-item.dragging');
      if (!dragging) return;
      const siblings = [...list.querySelectorAll('.task-item:not(.dragging)')];
      const next = siblings.find((el) => {
        const rect = el.getBoundingClientRect();
        return e.clientY < rect.top + rect.height / 2;
      });
      if (next) {
        list.insertBefore(dragging, next);
      } else {
        list.appendChild(dragging);
      }
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
      const list = document.getElementById('taskList');
      const items = [...list.querySelectorAll('.task-item')];
      if (items.length === 0) return;
      const oldTasks = getTasks();
      saveTasks(items.map((el) => oldTasks[Number(el.dataset.index)]));
      renderTasks();
    }

    function exportTasks() {
      const tasks = getTasks();
      if (tasks.length === 0) {
        alert('No tasks to export.');
        return;
      }
      const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'todo-tasks-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importTasks(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data)) throw new Error('invalid');
          const tasks = data
            .filter((t) => t && typeof t.text === 'string')
            .map((t) => ({ text: t.text, completed: Boolean(t.completed) }));
          saveTasks(tasks);
          renderTasks();
        } catch {
          alert('Invalid JSON file. Expected an array of { text, completed } objects.');
        }
      };
      reader.readAsText(file);
    }

    function clearAllTasks() {
      if (!confirm('Delete all tasks? This cannot be undone.')) return;
      saveTasks([]);
      renderTasks();
    }

    document.getElementById('taskList').addEventListener('dragover', handleDragOver);
    document.getElementById('addTaskBtn').addEventListener('click', addTask);
    document.getElementById('exportBtn').addEventListener('click', exportTasks);
    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFileInput').click();
    });
    document.getElementById('importFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) importTasks(file);
      e.target.value = '';
    });
    document.getElementById('clearBtn').addEventListener('click', clearAllTasks);
    document.getElementById('newTaskInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    renderTasks();
  </script>
</body>
</html>
