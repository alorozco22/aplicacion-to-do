<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To Do List // LCARS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cyan: #35f0ff;
      --teal: #0fd6c0;
      --teal-green: #28e6a0;
      --amber: #ffb45e;
      --red: #ff6166;
      --text: #e9fcfd;
      --text-dim: rgba(233, 252, 253, 0.5);
      --panel: rgba(6, 14, 24, 0.78);
      --panel-2: rgba(10, 22, 34, 0.62);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      font-family: 'Chakra Petch', 'Space Mono', monospace;
      padding: 40px 20px;
      background: #04060f;
      background-image:
        radial-gradient(ellipse 90% 70% at 50% 42%, rgba(20, 60, 90, 0.28), rgba(4, 6, 15, 0.92) 72%),
        linear-gradient(180deg, #04060f, #060b18);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
    }

    #starfield {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(11, 13, 23, 0.42) 0%,
        rgba(11, 13, 23, 0.2) 40%,
        rgba(11, 13, 23, 0.5) 100%
      );
      z-index: 1;
    }

    .notepad {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 620px;
      background: var(--panel);
      border-radius: 6px 34px 34px 6px;
      border: 1px solid rgba(53, 240, 255, 0.22);
      box-shadow:
        0 0 46px rgba(53, 240, 255, 0.1),
        0 8px 40px rgba(0, 0, 0, 0.55),
        inset 0 0 0 1px rgba(53, 240, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
    }

    .lcars-top {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 14px 20px 0;
      background: linear-gradient(180deg, rgba(53, 240, 255, 0.06), transparent);
    }

    .lcars-top .seg {
      display: block;
      height: 8px;
      border-radius: 0 8px 8px 0;
    }

    .lcars-top .s1 {
      width: 46px;
      background: var(--cyan);
      box-shadow: 0 0 18px rgba(53, 240, 255, 0.55);
    }

    .lcars-top .s2 {
      height: 4px;
      width: 24px;
      background: var(--teal);
      box-shadow: 0 0 14px rgba(15, 214, 192, 0.5);
    }

    .lcars-top .s3 {
      height: 14px;
      width: 10px;
      background: rgba(53, 240, 255, 0.5);
      border-radius: 2px 10px 10px 2px;
    }

    .notepad-header {
      padding: 10px 20px 12px;
    }

    .title-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 12px;
    }

    .title-chip {
      font-family: 'Chakra Petch', monospace;
      font-weight: 700;
      font-size: 17px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #04151a;
      background: linear-gradient(135deg, var(--cyan), var(--teal));
      padding: 7px 18px;
      border-radius: 3px 16px 16px 3px;
      box-shadow: 0 0 28px rgba(53, 240, 255, 0.4);
    }

    .sys-status {
      margin-left: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 2px;
      color: var(--text-dim);
      transition: color 0.3s;
    }

    .sys-status.offline {
      color: var(--amber);
    }

    .sys-status.offline .led {
      background: var(--amber);
      box-shadow: 0 0 12px var(--amber);
      animation: none;
    }

    .led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--teal-green);
      box-shadow: 0 0 10px var(--teal-green);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    .timer-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: auto;
    }

    .timer-btn {
      position: relative;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      padding: 6px 10px;
      background: rgba(53, 240, 255, 0.05);
      color: rgba(233, 252, 253, 0.65);
      border: 1px solid rgba(53, 240, 255, 0.22);
      border-radius: 2px 10px 10px 2px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .timer-btn:hover {
      color: #fff;
      border-color: rgba(53, 240, 255, 0.6);
      background: rgba(53, 240, 255, 0.14);
      box-shadow: 0 0 12px rgba(53, 240, 255, 0.25);
    }

    #timerRunBtn {
      min-width: 64px;
    }

    .timer-progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 2px;
      width: 100%;
      background: var(--cyan);
      transform-origin: left center;
      transform: scaleX(1);
      transition: transform 0.4s linear;
    }

    .timer-chip.break .timer-btn {
      color: var(--amber);
      border-color: rgba(255, 180, 94, 0.35);
    }

    .timer-chip.break .timer-btn:hover {
      background: rgba(255, 180, 94, 0.1);
    }

    .timer-chip.break .timer-progress {
      background: var(--amber);
    }

    .status-strip {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(53, 240, 255, 0.2);
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
    }

    .status-strip .status-label {
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .status-strip .spacer {
      flex: 1;
    }

    .readout {
      color: var(--text-dim);
    }

    .readout b {
      color: var(--cyan);
      font-weight: 700;
    }

    .readout.idle {
      color: rgba(40, 230, 160, 0.65);
    }

    .readout.stardate {
      animation: flicker 2.4s ease-in-out infinite;
    }

    .readout.stardate b {
      color: var(--teal-green);
    }

    @keyframes flicker {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.75; }
    }

    .notepad-body {
      padding: 8px 16px 10px;
      min-height: 260px;
      max-height: 60vh;
      overflow-y: auto;
    }

    .notepad-body::-webkit-scrollbar {
      width: 6px;
    }

    .notepad-body::-webkit-scrollbar-track {
      background: transparent;
    }

    .notepad-body::-webkit-scrollbar-thumb {
      background: rgba(53, 240, 255, 0.3);
      border-radius: 3px;
    }

    .task-list {
      list-style: none;
      counter-reset: tsk;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      counter-increment: tsk;
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 13px 44px 13px 15px;
      border: 1px solid rgba(53, 240, 255, 0.16);
      border-left: 3px solid var(--cyan);
      border-radius: 3px 18px 18px 3px;
      background-color: var(--panel-2);
      background-image:
        linear-gradient(var(--cyan), var(--cyan)) 12px 12px / 12px 2px no-repeat,
        linear-gradient(var(--cyan), var(--cyan)) 12px 12px / 2px 12px no-repeat,
        linear-gradient(var(--teal-green), var(--teal-green)) calc(100% - 12px) calc(100% - 12px) / 16px 2px no-repeat,
        linear-gradient(var(--teal-green), var(--teal-green)) calc(100% - 12px) calc(100% - 12px) / 2px 16px no-repeat,
        repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.014) 0 1px, transparent 1px 3px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.2s, background-color 0.2s;
    }

    .task-item::before {
      content: "TSK-" counter(tsk, decimal-leading-zero);
      position: absolute;
      top: 8px;
      right: 12px;
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 2px;
      color: rgba(53, 240, 255, 0.45);
    }

    .task-item:hover {
      transform: translateY(-1px);
      border-color: rgba(53, 240, 255, 0.4);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4), 0 0 24px rgba(53, 240, 255, 0.16);
    }

    .task-item[draggable='true'] {
      cursor: grab;
    }

    .task-item.dragging {
      opacity: 0.35;
      background-color: rgba(53, 240, 255, 0.08);
      border-color: var(--cyan);
      box-shadow: inset 3px 0 0 var(--cyan), 0 0 24px rgba(53, 240, 255, 0.25);
    }

    .task-item.completed {
      border-color: rgba(40, 230, 160, 0.28);
      border-left-color: var(--teal-green);
      background-color: rgba(9, 30, 26, 0.6);
    }

    .task-item.completed::before {
      content: "TSK-" counter(tsk, decimal-leading-zero) "  //  COMPL";
      color: rgba(40, 230, 160, 0.6);
    }

    .task-item.completed:hover {
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4), 0 0 24px rgba(40, 230, 160, 0.12);
    }

    .task-bullet {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      margin-top: 1px;
      border: 1px solid rgba(53, 240, 255, 0.45);
      clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
      background: rgba(53, 240, 255, 0.06);
      filter: drop-shadow(0 0 6px rgba(53, 240, 255, 0.4));
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.25s ease;
    }

    .task-bullet:hover {
      border-color: var(--cyan);
      background: rgba(53, 240, 255, 0.16);
      filter: drop-shadow(0 0 10px rgba(53, 240, 255, 0.7));
    }

    .task-item.completed .task-bullet {
      border-color: transparent;
      background: radial-gradient(circle at 50% 50%, var(--teal-green), #0a9c75);
      filter: drop-shadow(0 0 8px rgba(40, 230, 160, 0.7));
    }

    .task-item.completed .task-bullet::after {
      content: '\2713';
      color: #02130d;
      font-size: 12px;
      font-weight: 700;
    }

    .task-text {
      flex: 1;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      word-break: break-word;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
      color: rgba(40, 230, 160, 0.4);
    }

    .task-text-input {
      flex: 1;
      font-family: 'Chakra Petch', monospace;
      font-size: 14px;
      line-height: 1.7;
      color: var(--text);
      border: none;
      border-bottom: 1px solid rgba(53, 240, 255, 0.5);
      background: rgba(53, 240, 255, 0.06);
      outline: none;
      padding: 2px 4px;
    }

    .task-actions {
      display: flex;
      gap: 6px;
      margin-left: 4px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .task-item:hover .task-actions {
      opacity: 1;
    }

    .task-actions button {
      background: rgba(53, 240, 255, 0.06);
      border: 1px solid rgba(53, 240, 255, 0.25);
      border-radius: 2px 10px 10px 2px;
      cursor: pointer;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: rgba(233, 252, 253, 0.5);
      padding: 3px 9px;
      transition: all 0.2s;
    }

    .task-actions button:hover {
      color: #fff;
      background: rgba(53, 240, 255, 0.18);
      border-color: var(--cyan);
      box-shadow: 0 0 14px rgba(53, 240, 255, 0.35);
    }

    .task-actions button.delete-btn:hover {
      color: var(--red);
      border-color: rgba(255, 97, 102, 0.6);
      background: rgba(255, 97, 102, 0.1);
      box-shadow: none;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 6px;
      padding: 10px 20px;
      row-gap: 8px;
      border-top: 1px solid rgba(53, 240, 255, 0.14);
      border-bottom: 1px solid rgba(53, 240, 255, 0.14);
      background: rgba(4, 12, 20, 0.5);
    }

    .toolbar .spacer {
      flex: 1;
    }

    .toolbar button,
    .toolbar a {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      padding: 5px 12px;
      background: rgba(53, 240, 255, 0.05);
      color: rgba(233, 252, 253, 0.55);
      border: 1px solid rgba(53, 240, 255, 0.22);
      border-radius: 2px 12px 12px 2px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .toolbar button:hover,
    .toolbar a:hover {
      color: #fff;
      border-color: rgba(53, 240, 255, 0.7);
      background: rgba(53, 240, 255, 0.15);
      box-shadow: 0 0 16px rgba(53, 240, 255, 0.3);
    }

    .toolbar button.danger {
      color: rgba(255, 180, 94, 0.7);
      border-color: rgba(255, 180, 94, 0.28);
    }

    .toolbar button.danger:hover {
      color: var(--amber);
      border-color: rgba(255, 180, 94, 0.55);
      background: rgba(255, 180, 94, 0.08);
      box-shadow: none;
    }

    .toolbar button.ambience {
      border-radius: 2px 12px 12px 2px;
    }

    .toolbar button.ambience.on {
      color: var(--teal-green);
      border-color: rgba(40, 230, 160, 0.55);
      background: rgba(40, 230, 160, 0.12);
      box-shadow: 0 0 16px rgba(40, 230, 160, 0.3);
    }

    .vol {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-left: 2px;
    }

    .vol-label,
    .vol-val {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      letter-spacing: 1.5px;
      color: rgba(233, 252, 253, 0.5);
    }

    .vol-val {
      color: var(--cyan);
      min-width: 20px;
      text-align: right;
    }

    .vol input[type='range'] {
      width: 56px;
      accent-color: var(--teal-green);
      cursor: pointer;
    }

    .add-task-area {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 18px 20px 22px;
    }

    .add-task-area input {
      flex: 1;
      font-family: 'Chakra Petch', monospace;
      font-size: 14px;
      padding: 12px 16px;
      border: 1px solid rgba(53, 240, 255, 0.22);
      border-bottom: 2px solid rgba(53, 240, 255, 0.4);
      border-radius: 3px;
      background: rgba(4, 12, 20, 0.55);
      outline: none;
      color: var(--text);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .add-task-area input::placeholder {
      color: rgba(233, 252, 253, 0.28);
      letter-spacing: 1px;
    }

    .add-task-area input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 1px rgba(53, 240, 255, 0.35), 0 0 24px rgba(53, 240, 255, 0.18);
    }

    .add-task-area button {
      font-family: 'Chakra Petch', monospace;
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 12px 26px;
      background: linear-gradient(135deg, var(--cyan), var(--teal));
      color: #03262b;
      border: none;
      border-radius: 3px 16px 16px 3px;
      cursor: pointer;
      box-shadow: 0 0 26px rgba(53, 240, 255, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .add-task-area button:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 34px rgba(53, 240, 255, 0.5);
    }

    .add-task-area button:active {
      transform: translateY(0);
    }

    .empty-state {
      text-align: center;
      padding: 46px 24px;
      color: rgba(233, 252, 253, 0.3);
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      font-style: italic;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>
  <canvas id="starfield" aria-hidden="true"></canvas>
  <div class="notepad">
    <div class="lcars-top" aria-hidden="true">
      <span class="seg s1"></span>
      <span class="seg s2"></span>
      <span class="seg s3"></span>
    </div>
    <div class="notepad-header">
      <div class="title-row">
        <div class="title-chip">TO DO LIST</div>
        <div class="timer-chip" id="timerChip">
          <button class="timer-btn" id="timerModeBtn" title="Switch focus/break mode (25:10 / 15:5 / 5:2)"></button>
          <button class="timer-btn" id="timerRunBtn" title="Start / pause the timer">
            <span id="timerRunVal">25:00</span>
            <span class="timer-progress" id="timerProgress" aria-hidden="true"></span>
          </button>
        </div>
        <div class="sys-status" id="sysStatus">
          <span class="led"></span>
          <span id="sysStatusText">SYS // ONLINE</span>
        </div>
      </div>
      <div class="status-strip">
        <span class="status-label">// Mission Manifest</span>
        <span class="spacer"></span>
        <span class="readout" id="pendingReadout">TASKS PENDING: <b>0</b></span>
        <span class="readout stardate">STARDATE <b id="stardate">0000.0</b></span>
      </div>
    </div>
    <div class="toolbar">
      <a href="index.html" title="Switch to the standard interface">Standard UI</a>
      <button id="exportBtn" title="Export tasks to a JSON file">Export</button>
      <button id="importBtn" title="Import tasks from a JSON file">Import</button>
      <div class="spacer"></div>
      <button id="ambienceBtn" class="ambience" title="Toggle the warp-hum ambience sound">Ambience</button>
      <div class="vol">
        <span class="vol-label">VOL</span>
        <input type="range" id="volumeSlider" min="0" max="100" step="1" aria-label="Master volume" />
        <span class="vol-val" id="volumeVal"></span>
      </div>
      <button id="clearBtn" class="danger" title="Delete all tasks">Purge</button>
      <input type="file" id="importFileInput" accept=".json,application/json" hidden />
    </div>
    <div class="notepad-body">
      <ul class="task-list" id="taskList"></ul>
    </div>
    <div class="add-task-area">
      <input type="text" id="newTaskInput" placeholder="Enter new task designation..." />
      <button id="addTaskBtn">Add</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'todo-tasks';

    function getTasks() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTasks(tasks) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    let audioCtx = null;
    let masterGain = null;
    let volume = parseFloat(localStorage.getItem('todo-volume'));
    if (!(volume >= 0)) volume = 80;

    function getAudioCtx() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);
        masterGain.gain.value = volume === 0 ? 0 : Math.pow(volume / 100, 1.3);
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function getMaster() {
      return masterGain;
    }

    const Sound = (() => {
      function ac() {
        return getAudioCtx();
      }

      function tone({ freq = 440, endFreq = null, type = 'sine', dur = 0.12, gain = 0.08, delay = 0 }) {
        const c = ac();
        const t0 = c.currentTime + delay;
        const osc = c.createOscillator();
        const g = c.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t0);
        if (endFreq !== null) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + dur);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        osc.connect(g);
        g.connect(getMaster());
        osc.start(t0);
        osc.stop(t0 + dur + 0.02);
      }

      return {
        toggle(completed) {
          if (completed) {
            tone({ freq: 660, endFreq: 880, type: 'triangle', dur: 0.09, gain: 0.07 });
            tone({ freq: 990, type: 'triangle', dur: 0.08, gain: 0.05, delay: 0.06 });
          } else {
            tone({ freq: 520, endFreq: 340, type: 'triangle', dur: 0.1, gain: 0.06 });
          }
        },
        add() {
          tone({ freq: 520, type: 'sine', dur: 0.07, gain: 0.07 });
          tone({ freq: 780, type: 'sine', dur: 0.09, gain: 0.06, delay: 0.06 });
        },
        delete() {
          tone({ freq: 440, endFreq: 220, type: 'triangle', dur: 0.12, gain: 0.06 });
        },
        clear() {
          tone({ freq: 440, endFreq: 140, type: 'sawtooth', dur: 0.35, gain: 0.025 });
          tone({ freq: 220, endFreq: 70, type: 'sine', dur: 0.42, gain: 0.05, delay: 0.03 });
        },
        dragStart() {
          tone({ freq: 600, endFreq: 720, type: 'sine', dur: 0.06, gain: 0.045 });
        },
        drop() {
          tone({ freq: 500, type: 'square', dur: 0.05, gain: 0.035 });
          tone({ freq: 760, type: 'square', dur: 0.06, gain: 0.035, delay: 0.05 });
        },
        edit() {
          tone({ freq: 880, endFreq: 520, type: 'sine', dur: 0.08, gain: 0.045 });
        },
        data() {
          tone({ freq: 600, type: 'sine', dur: 0.07, gain: 0.05 });
          tone({ freq: 900, type: 'sine', dur: 0.09, gain: 0.04, delay: 0.08 });
        },
        breakStart() {
          tone({ freq: 440, endFreq: 660, type: 'triangle', dur: 0.12, gain: 0.06 });
          tone({ freq: 660, endFreq: 880, type: 'triangle', dur: 0.14, gain: 0.06, delay: 0.13 });
        },
        breakEnd() {
          tone({ freq: 660, type: 'sine', dur: 0.09, gain: 0.06 });
          tone({ freq: 880, type: 'sine', dur: 0.09, gain: 0.05, delay: 0.09 });
          tone({ freq: 1100, type: 'sine', dur: 0.12, gain: 0.05, delay: 0.18 });
        },
        hover() {
          tone({ freq: 1200, type: 'sine', dur: 0.04, gain: 0.012 });
        }
      };
    })();

    const Ambience = (() => {
      let nodes = null;
      let on = false;
      const btn = document.getElementById('ambienceBtn');

      function sync() {
        if (btn) btn.classList.toggle('on', on);
      }

      function start() {
        if (on) return;
        const c = getAudioCtx();
        const master = c.createGain();
        master.gain.setValueAtTime(0.0001, c.currentTime);
        master.gain.exponentialRampToValueAtTime(0.06, c.currentTime + 2.5);
        master.connect(getMaster());

        const oscA = c.createOscillator();
        oscA.type = 'sine';
        oscA.frequency.value = 55;
        const gA = c.createGain();
        gA.gain.value = 1;
        oscA.connect(gA);
        gA.connect(master);

        const oscB = c.createOscillator();
        oscB.type = 'sine';
        oscB.frequency.value = 62;
        const gB = c.createGain();
        gB.gain.value = 0.4;
        oscB.connect(gB);
        gB.connect(master);

        const lfo = c.createOscillator();
        lfo.type = 'sine';
        lfo.frequency.value = 0.08;
        const lfoGain = c.createGain();
        lfoGain.gain.value = 0.2;
        lfo.connect(lfoGain);
        lfoGain.connect(gB.gain);

        const len = Math.floor(c.sampleRate * 3);
        const buffer = c.createBuffer(1, len, c.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        const noise = c.createBufferSource();
        noise.buffer = buffer;
        noise.loop = true;
        const nFilter = c.createBiquadFilter();
        nFilter.type = 'lowpass';
        nFilter.frequency.value = 260;
        const nGain = c.createGain();
        nGain.gain.value = 0.3;
        noise.connect(nFilter);
        nFilter.connect(nGain);
        nGain.connect(master);

        oscA.start();
        oscB.start();
        lfo.start();
        noise.start();
        nodes = { master, oscA, oscB, lfo, noise };
        on = true;
        sync();
      }

      function stop() {
        if (!on || !nodes) return;
        const c = getAudioCtx();
        const t = c.currentTime;
        nodes.master.gain.cancelScheduledValues(t);
        nodes.master.gain.setValueAtTime(nodes.master.gain.value, t);
        nodes.master.gain.exponentialRampToValueAtTime(0.0001, t + 0.8);
        const keep = nodes;
        setTimeout(() => {
          try {
            keep.oscA.stop();
            keep.oscB.stop();
            keep.lfo.stop();
            keep.noise.stop();
            keep.master.disconnect();
          } catch {}
        }, 1000);
        nodes = null;
        on = false;
        sync();
      }

      return {
        start,
        stop,
        get isOn() {
          return on;
        }
      };
    })();

    const Timer = (() => {
      const MODES = [
        { label: '25:10', work: 25, rest: 10 },
        { label: '15:5', work: 15, rest: 5 },
        { label: '5:2', work: 5, rest: 2 }
      ];
      let modeIdx = 0;
      let phase = 'work';
      let running = false;
      let remaining = 0;
      let phaseEnd = 0;
      let tickId = null;

      const modeBtn = document.getElementById('timerModeBtn');
      const chip = document.getElementById('timerChip');
      const runVal = document.getElementById('timerRunVal');
      const progress = document.getElementById('timerProgress');
      const sysStatus = document.getElementById('sysStatus');
      const sysStatusText = document.getElementById('sysStatusText');

      function phaseDuration() {
        return (phase === 'work' ? MODES[modeIdx].work : MODES[modeIdx].rest) * 60000;
      }

      function fmt(ms) {
        const total = Math.max(0, Math.round(ms / 1000));
        const m = Math.floor(total / 60);
        const s = total % 60;
        return m + ':' + String(s).padStart(2, '0');
      }

      function setStatus() {
        const offline = phase === 'break';
        sysStatus.classList.toggle('offline', offline);
        sysStatusText.textContent = offline ? 'SYS // OFFLINE' : 'SYS // ONLINE';
      }

      function refreshUI() {
        modeBtn.textContent = MODES[modeIdx].label;
        chip.classList.toggle('break', phase === 'break');
        setStatus();
        let shown = phaseDuration();
        if (running) shown = Math.max(0, phaseEnd - Date.now());
        else if (remaining > 0) shown = remaining;
        runVal.textContent = (running ? '\u2016 ' : '\u25B6 ') + fmt(shown);
        const frac = phaseDuration() ? Math.max(0, Math.min(1, shown / phaseDuration())) : 1;
        progress.style.transform = 'scaleX(' + frac + ')';
      }

      function tick() {
        if (phaseEnd - Date.now() <= 0) {
          if (phase === 'work') {
            phase = 'break';
            Sound.breakStart();
          } else {
            phase = 'work';
            Sound.breakEnd();
          }
          remaining = phaseDuration();
          phaseEnd = Date.now() + remaining;
          refreshUI();
          return;
        }
        refreshUI();
      }

      return {
        toggle() {
          Sound.hover();
          if (running) {
            remaining = Math.max(0, phaseEnd - Date.now());
            running = false;
            clearInterval(tickId);
            refreshUI();
            return;
          }
          if (remaining <= 0) remaining = phaseDuration();
          phaseEnd = Date.now() + remaining;
          running = true;
          clearInterval(tickId);
          tickId = setInterval(tick, 250);
          Ambience.start();
          Starfield.boost();
          refreshUI();
        },
        cycleMode() {
          modeIdx = (modeIdx + 1) % MODES.length;
          phase = 'work';
          running = false;
          remaining = 0;
          clearInterval(tickId);
          Sound.edit();
          refreshUI();
        },
        refreshUI
      };
    })();

    const Starfield = (() => {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let stars = [];
      let W = 0;
      let H = 0;
      let warpT = 0;
      let nextWarp = 20 + Math.random() * 22;
      let lastTs = performance.now();

      function spawn() {
        return {
          x0: Math.random(),
          y0: Math.random(),
          z: Math.random(),
          b: 0.55 + Math.random() * 0.45,
          v: 0.01 + Math.random() * 0.006,
          hue: Math.random()
        };
      }

      function build() {
        const count = Math.min(460, Math.floor((W * H) / 3600));
        stars = [];
        for (let i = 0; i < count; i++) stars.push(spawn());
      }

      function rgbFor(s) {
        if (s.hue < 0.18) return '156,222,255';
        if (s.hue < 0.24) return '129,255,241';
        return '219,239,255';
      }

      function project(s) {
        const f = 0.18 + s.z * 5.2;
        return {
          x: W * 0.5 + (s.x0 - 0.5) * W * f * 1.05,
          y: H * 0.46 + (s.y0 - 0.5) * H * f * 1.05 * 0.9
        };
      }

      function drawDot(s, p, a) {
        const col = rgbFor(s);
        const hs = 0.6 + s.z * 1.6;
        ctx.fillStyle = 'rgba(' + col + ',' + a.toFixed(3) + ')';
        ctx.fillRect(p.x - hs / 2, p.y - hs / 2, hs, hs);
      }

      function redraw() {
        ctx.clearRect(0, 0, W, H);
        const now = performance.now();
        const dt = Math.min((now - lastTs) / 1000, 0.05);
        lastTs = now;

        if (!reduced) {
          nextWarp -= dt;
          if (nextWarp <= 0) {
            nextWarp = 26 + Math.random() * 20;
            warpT = 9;
          }
        }
        let f = 0;
        if (warpT > 0) {
          warpT -= dt;
          const u = Math.min(1, Math.max(0, 1 - warpT / 9));
          f = Math.sin(u * Math.PI);
        }
        const boost = 1 + f * 7;

        for (const s of stars) {
          const prev = project(s);
          s.z += s.v * dt * boost;
          if (s.z >= 1) {
            s.z = 0;
            s.x0 = Math.random();
            s.y0 = Math.random();
          }
          const cur = project(s);
          const a = Math.min(1, (0.3 + s.z * 0.7) * s.b);
          const dx = cur.x - prev.x;
          const dy = cur.y - prev.y;
          const len = Math.hypot(dx, dy);
          if (len < 0.7) {
            drawDot(s, cur, a);
          } else {
            ctx.strokeStyle = 'rgba(' + rgbFor(s) + ',' + a.toFixed(3) + ')';
            ctx.lineWidth = 0.5 + s.z * 1.5;
            ctx.beginPath();
            ctx.moveTo(prev.x, prev.y);
            ctx.lineTo(cur.x, cur.y);
            ctx.stroke();
            drawDot(s, cur, Math.min(1, a + 0.15));
          }
        }

        requestAnimationFrame(redraw);
      }

      function drawStatic() {
        ctx.clearRect(0, 0, W, H);
        for (const s of stars) {
          const p = project(s);
          drawDot(s, p, 0.55 + s.z * 0.45);
        }
      }

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        build();
        if (reduced) drawStatic();
      }

      return {
        init() {
          resize();
          window.addEventListener('resize', resize);
          if (!reduced) requestAnimationFrame(redraw);
        },
        boost(seconds) {
          if (reduced) return;
          warpT = Math.max(warpT, seconds || 9);
          nextWarp = Math.max(nextWarp, 30 + Math.random() * 20);
        }
      };
    })();

    function getStardate() {
      const now = new Date();
      const doy =
        Math.floor((now.getTime() - Date.UTC(now.getUTCFullYear(), 0, 0)) / 86400000) +
        now.getUTCHours() / 24;
      const stardate = 41153.716 + (now.getUTCFullYear() - 1987) * 1000 + (doy / 365.24) * 1000;
      return stardate.toFixed(1);
    }

    function updateStatus() {
      const tasks = getTasks();
      const pending = tasks.filter((t) => !t.completed).length;
      const readout = document.getElementById('pendingReadout');
      if (pending > 0) {
        readout.className = 'readout';
        readout.innerHTML = 'TASKS PENDING: <b>' + pending + '</b>';
      } else {
        readout.className = 'readout idle';
        readout.innerHTML = 'ALL TASKS ACQUIRED';
      }
      document.getElementById('stardate').textContent = getStardate();
    }

    function renderTasks() {
      const tasks = getTasks();
      const list = document.getElementById('taskList');
      list.innerHTML = '';

      if (tasks.length === 0) {
        list.innerHTML = '<li class="empty-state">No tasks yet. Add one above, Commander.</li>';
        updateStatus();
        return;
      }

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.completed ? ' completed' : '');
        li.draggable = true;
        li.dataset.index = index;
        li.addEventListener('dragstart', handleDragStart);
        li.addEventListener('dragend', handleDragEnd);

        const bullet = document.createElement('div');
        bullet.className = 'task-bullet';
        bullet.title = 'Toggle completed';
        bullet.addEventListener('click', () => toggleTask(index));
        bullet.addEventListener('mouseenter', () => Sound.hover());

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;
        text.addEventListener('dblclick', () => startEditing(index, li, task));

        const actions = document.createElement('div');
        actions.className = 'task-actions';

        const editBtn = document.createElement('button');
        editBtn.textContent = '\u270E';
        editBtn.title = 'Edit task';
        editBtn.addEventListener('click', () => startEditing(index, li, task));

        const deleteBtn = document.createElement('button');
        deleteBtn.className = 'delete-btn';
        deleteBtn.textContent = '\u2715';
        deleteBtn.title = 'Delete task';
        deleteBtn.addEventListener('click', () => deleteTask(index));

        actions.appendChild(editBtn);
        actions.appendChild(deleteBtn);

        li.appendChild(bullet);
        li.appendChild(text);
        li.appendChild(actions);
        list.appendChild(li);
      });

      updateStatus();
    }

    function startEditing(index, li, task) {
      const tasks = getTasks();
      const textSpan = li.querySelector('.task-text');
      if (!textSpan) return;

      Sound.edit();
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'task-text-input';
      input.value = task.text;

      function finishEdit() {
        const newText = input.value.trim();
        if (newText) {
          tasks[index].text = newText;
          saveTasks(tasks);
        }
        renderTasks();
      }

      input.addEventListener('blur', finishEdit);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') input.blur();
        if (e.key === 'Escape') {
          input.value = task.text;
          input.blur();
        }
      });

      textSpan.replaceWith(input);
      input.focus();
      input.select();
    }

    function addTask() {
      const input = document.getElementById('newTaskInput');
      const text = input.value.trim();
      if (!text) return;

      const tasks = getTasks();
      tasks.push({ text, completed: false });
      Sound.add();
      saveTasks(tasks);
      input.value = '';
      renderTasks();
    }

    function toggleTask(index) {
      const tasks = getTasks();
      tasks[index].completed = !tasks[index].completed;
      Sound.toggle(tasks[index].completed);
      saveTasks(tasks);
      renderTasks();
    }

    function deleteTask(index) {
      const tasks = getTasks();
      tasks.splice(index, 1);
      Sound.delete();
      saveTasks(tasks);
      renderTasks();
    }

    function handleDragStart(e) {
      Sound.dragStart();
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', '');
      requestAnimationFrame(() => this.classList.add('dragging'));
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const list = document.getElementById('taskList');
      const dragging = list.querySelector('.task-item.dragging');
      if (!dragging) return;
      const siblings = [...list.querySelectorAll('.task-item:not(.dragging)')];
      const next = siblings.find((el) => {
        const rect = el.getBoundingClientRect();
        return e.clientY < rect.top + rect.height / 2;
      });
      if (next) {
        list.insertBefore(dragging, next);
      } else {
        list.appendChild(dragging);
      }
    }

    function handleDragEnd() {
      this.classList.remove('dragging');
      const list = document.getElementById('taskList');
      const items = [...list.querySelectorAll('.task-item')];
      if (items.length === 0) return;
      const oldTasks = getTasks();
      const reordered = items.map((el) => oldTasks[Number(el.dataset.index)]);
      if (JSON.stringify(reordered) !== JSON.stringify(oldTasks)) Sound.drop();
      saveTasks(reordered);
      renderTasks();
    }

    function exportTasks() {
      const tasks = getTasks();
      if (tasks.length === 0) {
        alert('No tasks to export.');
        return;
      }
      const blob = new Blob([JSON.stringify(tasks, null, 2)], { type: 'application/json' });
      Sound.data();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'todo-tasks-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function importTasks(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!Array.isArray(data)) throw new Error('invalid');
          const tasks = data
            .filter((t) => t && typeof t.text === 'string')
            .map((t) => ({ text: t.text, completed: Boolean(t.completed) }));
          Sound.data();
          saveTasks(tasks);
          renderTasks();
        } catch {
          alert('Invalid JSON file. Expected an array of { text, completed } objects.');
        }
      };
      reader.readAsText(file);
    }

    function clearAllTasks() {
      if (!confirm('Delete all tasks? This cannot be undone.')) return;
      Sound.clear();
      saveTasks([]);
      renderTasks();
    }

    document.getElementById('taskList').addEventListener('dragover', handleDragOver);
    document.getElementById('addTaskBtn').addEventListener('click', addTask);
    document.getElementById('exportBtn').addEventListener('click', exportTasks);
    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFileInput').click();
    });
    document.getElementById('importFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) importTasks(file);
      e.target.value = '';
    });
    document.getElementById('clearBtn').addEventListener('click', clearAllTasks);
    document.getElementById('newTaskInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addTask();
    });

    document.querySelectorAll('.toolbar button, .toolbar a, #addTaskBtn').forEach((el) => {
      el.addEventListener('mouseenter', () => Sound.hover());
    });

    document.getElementById('timerModeBtn').addEventListener('click', Timer.cycleMode);
    document.getElementById('timerRunBtn').addEventListener('click', Timer.toggle);
    Timer.refreshUI();

    const ambienceBtn = document.getElementById('ambienceBtn');
    ambienceBtn.addEventListener('click', () => {
      if (Ambience.isOn) Ambience.stop();
      else Ambience.start();
    });

    const volSlider = document.getElementById('volumeSlider');
    const volVal = document.getElementById('volumeVal');

    function applyVolume() {
      const v = parseFloat(volSlider.value);
      if (!(v >= 0)) return;
      volume = v;
      localStorage.setItem('todo-volume', String(v));
      volVal.textContent = Math.round(v);
      if (masterGain) {
        const target = v === 0 ? 0 : Math.pow(v / 100, 1.3);
        masterGain.gain.setTargetAtTime(target, audioCtx.currentTime, 0.02);
      }
    }

    volSlider.value = volume;
    volVal.textContent = Math.round(volume);
    volSlider.addEventListener('input', applyVolume);

    Starfield.init();

    renderTasks();
  </script>
</body>
</html>
